<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Depot Safety AI</title>
  <style>
    :root {
      --navy: #0b2b52;
      --blue: #17689c;
      --blue2: #0f5d8f;
      --border: #d7e1eb;
      --text: #14314f;
      --muted: #60758c;
      --bg: #f4f7fa;
      --white: #fff;
      --green: #008b55;
      --green-bg: #e6faf1;
      --yellow: #a87800;
      --yellow-bg: #fff6d7;
      --red: #b42318;
      --red-bg: #ffebe9;
      --shadow: 0 4px 18px rgba(20, 49, 79, .08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 20px;
    }

    header {
      background: linear-gradient(135deg, #0b2b52, #17689c);
      color: white;
      border-radius: 18px;
      padding: 22px 24px;
      margin-bottom: 18px;
      box-shadow: var(--shadow);
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 27px;
    }

    header p {
      margin: 0;
      opacity: .9;
      font-size: 14px;
    }

    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 18px;
    }

    .upload-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .full { grid-column: 1 / -1; }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 7px;
      font-size: 14px;
    }

    input[type="text"],
    input[type="file"] {
      width: 100%;
      border: 1px solid #c7d5e2;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
      background: white;
    }

    input[type="file"] {
      padding: 10px;
    }

    .preview {
      min-height: 280px;
      background: #101010;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .preview img {
      display: block;
      max-width: 100%;
      max-height: 520px;
      object-fit: contain;
    }

    .placeholder {
      color: #c9c9c9;
      text-align: center;
      padding: 30px;
    }

    .analyse {
      width: 100%;
      border: 0;
      border-radius: 11px;
      padding: 15px 18px;
      background: var(--blue);
      color: white;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
    }

    .analyse:hover { background: var(--blue2); }

    .analyse:disabled {
      opacity: .6;
      cursor: wait;
    }

    .message {
      margin-top: 12px;
      border-radius: 12px;
      padding: 13px 15px;
      font-size: 14px;
      display: none;
      white-space: pre-wrap;
    }

    .message.success {
      display: block;
      background: var(--green-bg);
      color: var(--green);
    }

    .message.error {
      display: block;
      background: var(--red-bg);
      color: var(--red);
    }

    .message.loading {
      display: block;
      background: #eaf3fa;
      color: var(--blue);
    }

    .result-head {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .result-head h2 {
      margin: 0;
      font-size: 23px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 13px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 12px;
      letter-spacing: .2px;
    }

    .badge.pass {
      background: var(--green-bg);
      color: var(--green);
    }

    .badge.check {
      background: var(--yellow-bg);
      color: var(--yellow);
    }

    .badge.fail {
      background: var(--red-bg);
      color: var(--red);
    }

    .summary {
      margin: 14px 0 18px;
      color: #526d87;
      font-size: 15px;
    }

    .counts {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 10px 0 18px;
    }

    .count {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 7px 11px;
      background: #fff;
      font-size: 12px;
      font-weight: 700;
    }

    .finding {
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      margin-top: 14px;
      background: white;
    }

    .finding.fail {
      border-left: 5px solid #d92d20;
    }

    .finding.check {
      border-left: 5px solid #eab308;
    }

    .finding.pass {
      border-left: 5px solid #10b981;
    }

    .finding-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .finding h3 {
      margin: 0;
      font-size: 18px;
      line-height: 1.3;
    }

    .finding-meta {
      margin-top: 7px;
      color: #526d87;
      font-size: 13px;
    }

    .finding-observation {
      margin: 14px 0;
      line-height: 1.55;
      color: #35536f;
    }

    .equipment {
      display: inline-block;
      background: #eef5fb;
      color: #185d8d;
      padding: 5px 9px;
      border-radius: 7px;
      font-weight: 700;
      font-size: 12px;
      margin-top: 8px;
    }

    .section {
      margin-top: 18px;
      border-top: 1px solid #e4ebf2;
      padding-top: 15px;
    }

    .section h4 {
      margin: 0 0 10px;
      font-size: 14px;
    }

    .section.visual h4 { color: #17689c; }
    .section.physical h4 { color: #8b5a00; }

    .check-list {
      display: grid;
      gap: 8px;
    }

    .check-row {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      border: 1px solid #e4ebf2;
      border-radius: 9px;
      padding: 10px;
      background: #fbfdff;
      cursor: pointer;
    }

    .check-row:hover {
      background: #f5f9fc;
    }

    .check-row input {
      margin-top: 2px;
      width: 17px;
      height: 17px;
      flex: 0 0 auto;
    }

    .check-text {
      line-height: 1.4;
      font-size: 13px;
    }

    .importance {
      display: inline-block;
      margin-left: 6px;
      font-size: 10px;
      font-weight: 800;
      border-radius: 5px;
      padding: 2px 5px;
    }

    .importance.HIGH {
      color: #b42318;
      background: #ffebe9;
    }

    .importance.MEDIUM {
      color: #8b5a00;
      background: #fff6d7;
    }

    .importance.LOW {
      color: #17689c;
      background: #eaf3fa;
    }

    .source {
      margin-top: 16px;
      padding-top: 13px;
      border-top: 1px solid #e4ebf2;
      font-size: 12px;
      color: #5b7187;
    }

    .source a {
      color: #17689c;
      font-weight: 700;
    }

    .source-type {
      display: inline-block;
      margin-left: 7px;
      border-radius: 5px;
      padding: 3px 6px;
      font-weight: 700;
      background: #edf1f5;
      color: #526d87;
    }

    .verification-summary {
      margin-top: 12px;
      background: #f8fafc;
      border-radius: 9px;
      padding: 10px 12px;
      font-size: 12px;
      color: #526d87;
    }

    .no-checks {
      background: #fff8e1;
      border-radius: 9px;
      padding: 11px 12px;
      color: #805f00;
      font-size: 13px;
    }

    .inspection-info {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    .info-box {
      background: #f7f9fb;
      border-radius: 10px;
      padding: 10px 12px;
    }

    .info-label {
      color: #71859a;
      font-size: 11px;
      margin-bottom: 4px;
    }

    .info-value {
      font-size: 13px;
      font-weight: 700;
      word-break: break-word;
    }

    .hidden { display: none !important; }

    @media (max-width: 760px) {
      .page { padding: 10px; }
      .upload-grid { grid-template-columns: 1fr; }
      .full { grid-column: auto; }
      .inspection-info { grid-template-columns: 1fr; }
      header { border-radius: 12px; }
      .card { border-radius: 12px; padding: 14px; }
    }
  </style>
</head>

<body>
<div class="page">

  <header>
    <h1>Depot Safety AI</h1>
    <p>AI-assisted visual safety inspection for container depot and repair-yard operations</p>
  </header>

  <section class="card">
    <div class="upload-grid">

      <div class="full">
        <label>Safety Photo</label>
        <div class="preview" id="preview">
          <div class="placeholder">
            Select a photo of the work area, equipment or activity.
          </div>
        </div>
      </div>

      <div class="full">
        <label for="photo">Photo</label>
        <input id="photo" type="file" accept="image/*">
      </div>

      <div>
        <label for="location">Location</label>
        <input
          id="location"
          type="text"
          placeholder="e.g. Depot P10"
          autocomplete="off"
        >
      </div>

      <div>
        <label for="inspector">Inspector</label>
        <input
          id="inspector"
          type="text"
          placeholder="Inspector name"
          autocomplete="off"
        >
      </div>

      <div class="full">
        <button class="analyse" id="analyseButton">
          🔍 Analyse Photo
        </button>

        <div id="message" class="message"></div>
      </div>

    </div>
  </section>

  <section id="resultCard" class="card hidden">
    <div class="result-head">
      <h2>Inspection Result</h2>
      <span id="overallBadge" class="badge check">CHECK REQUIRED</span>
      <span id="inspectionNo" style="color:#526d87;font-size:13px;"></span>
    </div>

    <div class="inspection-info">
      <div class="info-box">
        <div class="info-label">Location</div>
        <div class="info-value" id="resultLocation">-</div>
      </div>
      <div class="info-box">
        <div class="info-label">Inspector</div>
        <div class="info-value" id="resultInspector">-</div>
      </div>
      <div class="info-box">
        <div class="info-label">Inspection ID</div>
        <div class="info-value" id="resultId">-</div>
      </div>
    </div>

    <div class="summary" id="summary"></div>

    <div class="counts" id="counts"></div>

    <div id="findings"></div>
  </section>

</div>

<script>
  const photoInput = document.getElementById("photo");
  const preview = document.getElementById("preview");
  const locationInput = document.getElementById("location");
  const inspectorInput = document.getElementById("inspector");
  const analyseButton = document.getElementById("analyseButton");
  const message = document.getElementById("message");
  const resultCard = document.getElementById("resultCard");

  let selectedFile = null;
  let currentInspectionId = null;

  photoInput.addEventListener("change", () => {
    const file = photoInput.files && photoInput.files[0];

    selectedFile = file || null;

    if (!file) {
      preview.innerHTML =
        '<div class="placeholder">Select a photo of the work area, equipment or activity.</div>';
      return;
    }

    const url = URL.createObjectURL(file);

    preview.innerHTML =
      '<img src="' + url + '" alt="Safety inspection photo">';

    clearMessage();
  });

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function setMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
  }

  function clearMessage() {
    message.textContent = "";
    message.className = "message";
  }

  function overallClass(value) {
    if (value === "PASS") return "pass";
    if (value === "ATTENTION") return "fail";
    return "check";
  }

  function overallText(value) {
    if (value === "PASS") return "PASS";
    if (value === "ATTENTION") return "ATTENTION REQUIRED";
    return "CHECK REQUIRED";
  }

  function findingClass(status) {
    if (status === "PASS") return "pass";
    if (status === "FAIL") return "fail";
    return "check";
  }

  function findingBadge(status) {
    if (status === "PASS") return "PASS";
    if (status === "FAIL") return "FAIL";
    return "CHECK REQUIRED";
  }

  function sourceTypeLabel(sourceType) {
    return sourceType === "WSHC_DIRECT"
      ? "WSHC DIRECT"
      : "WSHC DERIVED";
  }

  function renderCheckList(items, groupName, findingIndex) {
    if (!Array.isArray(items) || !items.length) {
      return '<div class="no-checks">No detailed checklist items were matched. Physical/site verification is still required.</div>';
    }

    const rows = items.map((item, index) => {
      const key =
        "inspection-" +
        findingIndex +
        "-" +
        groupName +
        "-" +
        index;

      const importance = item.importance || "MEDIUM";

      return `
        <label class="check-row" for="${key}">
          <input
            id="${key}"
            type="checkbox"
            data-inspection="${escapeHtml(currentInspectionId || "")}"
          >
          <span class="check-text">
            ${escapeHtml(item.check_item)}
            <span class="importance ${escapeHtml(importance)}">
              ${escapeHtml(importance)}
            </span>
          </span>
        </label>
      `;
    }).join("");

    return '<div class="check-list">' + rows + "</div>";
  }

  function restoreChecklistState() {
    if (!currentInspectionId) return;

    const key = "depotSafetyChecklist:" + currentInspectionId;
    let saved = {};

    try {
      saved = JSON.parse(localStorage.getItem(key) || "{}");
    } catch {
      saved = {};
    }

    document
      .querySelectorAll('input[type="checkbox"][data-inspection]')
      .forEach((checkbox, index) => {
        const id = "item-" + index;
        checkbox.dataset.checkId = id;
        checkbox.checked = !!saved[id];

        checkbox.addEventListener("change", () => {
          let state = {};
          try {
            state = JSON.parse(localStorage.getItem(key) || "{}");
          } catch {
            state = {};
          }

          state[id] = checkbox.checked;
          localStorage.setItem(key, JSON.stringify(state));
          updateVerificationSummary();
        });
      });

    updateVerificationSummary();
  }

  function updateVerificationSummary() {
    const boxes = Array.from(
      document.querySelectorAll('input[type="checkbox"][data-inspection]')
    );

    const checked = boxes.filter(box => box.checked).length;

    document.querySelectorAll(".verification-summary").forEach(el => {
      el.textContent =
        checked +
        " of " +
        boxes.length +
        " verification item(s) checked on this device.";
    });
  }

  function renderFinding(finding, index) {
    const status = finding.status || "CHECK_REQUIRED";
    const risk = finding.risk_level || "MEDIUM";
    const confidence = Math.round((Number(finding.confidence || 0) * 100));

    const visual = Array.isArray(finding.visual_checks)
      ? finding.visual_checks
      : [];

    const physical = Array.isArray(finding.physical_checks)
      ? finding.physical_checks
      : [];

    const source = finding.source_url
      ? `
        <div class="source">
          <strong>WSHC source:</strong>
          <a
            href="${escapeHtml(finding.source_url)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            ${escapeHtml(finding.source_title || "View WSHC guidance")}
          </a>
          <span class="source-type">
            ${escapeHtml(sourceTypeLabel(finding.source_type))}
          </span>
        </div>
      `
      : "";

    const visualSection = visual.length
      ? `
        <div class="section visual">
          <h4>👁 What can be checked visually</h4>
          ${renderCheckList(visual, "visual", index)}
        </div>
      `
      : "";

    const physicalSection = `
      <div class="section physical">
        <h4>👷 What the inspector must physically verify</h4>
        ${renderCheckList(physical, "physical", index)}
      </div>
    `;

    return `
      <article class="finding ${findingClass(status)}">
        <div class="finding-title-row">
          <div>
            <h3>${escapeHtml(finding.title)}</h3>
            <div class="finding-meta">
              <strong>${escapeHtml(finding.category)}</strong>
              · ${escapeHtml(risk)} risk
              · ${confidence}% AI confidence
            </div>

            ${
              finding.equipment_type
                ? `<span class="equipment">Equipment / activity: ${escapeHtml(
                    finding.equipment_type.replaceAll("_", " ")
                  )}</span>`
                : ""
            }
          </div>

          <span class="badge ${findingClass(status)}">
            ${escapeHtml(findingBadge(status))}
          </span>
        </div>

        <div class="finding-observation">
          ${escapeHtml(finding.observation)}
        </div>

        ${visualSection}
        ${physicalSection}

        <div class="verification-summary">
          0 verification items checked on this device.
        </div>

        ${source}
      </article>
    `;
  }

  function renderResult(data) {
    const inspection = data.inspection || {};
    const findings = Array.isArray(data.findings)
      ? data.findings
      : [];

    currentInspectionId = inspection.id || null;

    const badge = document.getElementById("overallBadge");
    const overall = inspection.overall_result || "CHECK_REQUIRED";

    badge.className = "badge " + overallClass(overall);
    badge.textContent = overallText(overall);

    document.getElementById("inspectionNo").textContent =
      inspection.inspection_no || "";

    document.getElementById("resultLocation").textContent =
      inspection.location || "-";

    document.getElementById("resultInspector").textContent =
      inspection.inspector || "-";

    document.getElementById("resultId").textContent =
      inspection.id || "-";

    document.getElementById("summary").textContent =
      data.summary || "";

    const counts = data.counts || {};

    document.getElementById("counts").innerHTML = `
      <span class="count">Total: ${Number(counts.total || 0)}</span>
      <span class="count">PASS: ${Number(counts.pass || 0)}</span>
      <span class="count">FAIL: ${Number(counts.fail || 0)}</span>
      <span class="count">CHECK REQUIRED: ${Number(
        counts.check_required || 0
      )}</span>
    `;

    if (!findings.length) {
      document.getElementById("findings").innerHTML = `
        <div class="no-checks">
          No structured visible findings were returned.
          Physical/site verification is required.
        </div>
      `;
    } else {
      document.getElementById("findings").innerHTML =
        findings.map(renderFinding).join("");
    }

    resultCard.classList.remove("hidden");

    restoreChecklistState();

    resultCard.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });
  }

  async function analysePhoto() {
    if (!selectedFile) {
      setMessage("Please select a safety photo first.", "error");
      return;
    }

    if (selectedFile.size > 12 * 1024 * 1024) {
      setMessage("The selected photo is larger than 12 MB.", "error");
      return;
    }

    analyseButton.disabled = true;
    analyseButton.textContent = "⏳ Analysing photo...";
    setMessage(
      "AI is analysing the photograph and retrieving relevant WSHC checks...",
      "loading"
    );

    resultCard.classList.add("hidden");

    try {
      const formData = new FormData();

      formData.append("image", selectedFile);
      formData.append(
        "location",
        locationInput.value.trim() || "Unspecified"
      );
      formData.append(
        "inspector",
        inspectorInput.value.trim() || "Unspecified"
      );

      const response = await fetch("/api/analyze", {
        method: "POST",
        body: formData
      });

      const data = await response.json();

      if (!response.ok || !data.ok) {
        const detail =
          data.detail ||
          data.error ||
          "Unknown API error.";

        throw new Error(
          [
            data.stage ? "Stage: " + data.stage : "",
            detail,
            data.inspectionId
              ? "Inspection ID: " + data.inspectionId
              : ""
          ]
            .filter(Boolean)
            .join("\n")
        );
      }

      setMessage("✓ Analysis completed.", "success");
      renderResult(data);

    } catch (error) {
      setMessage(
        "AI analysis failed.\n" +
        (error instanceof Error
          ? error.message
          : String(error)),
        "error"
      );
    } finally {
      analyseButton.disabled = false;
      analyseButton.textContent = "🔍 Analyse Photo";
    }
  }

  analyseButton.addEventListener("click", analysePhoto);
</script>
</body>
</html>
